# Tests every push to main and every pull request. On main, it then builds the
# self-contained deploy bundle (pnpm bundle) and publishes it to the `deploy` branch, in
# the `misomoon/` folder. The Deploy to Cloudflare button points there, because the
# button can't build a pnpm workspace.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @misomoon/tracker build
      - run: pnpm --filter @misomoon/dashboard build
      - run: pnpm test
      - run: pnpm check

      - name: Build the deploy bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: pnpm bundle
      - name: Publish to the deploy branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out="$RUNNER_TEMP/deploy-branch"
          if git fetch --depth=1 origin deploy; then
            git worktree add -B deploy "$out" origin/deploy
          else
            git worktree add --orphan -b deploy "$out"
          fi
          rm -rf "$out/misomoon"
          cp -R deploy "$out/misomoon"
          printf '# misomoon deploy bundle\n\nThis branch is built by CI from `main`. Do not edit it. The source is on the [main branch](https://github.com/%s).\n' "$GITHUB_REPOSITORY" > "$out/README.md"
          cd "$out"
          git add -A
          if git diff --cached --quiet; then
            echo "The bundle has not changed."
          else
            git commit -m "Bundle ${GITHUB_SHA::7}"
            git push origin deploy
          fi
