<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!-- the theme is set before the first paint, so a dark page never flashes light -->
		<script>
			try {
				const t = localStorage.getItem('misomoon-docs-theme')
				document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
			} catch {
				document.documentElement.dataset.theme = 'light'
			}
		</script>
		<!-- fonts are self-hosted, subset to latin and to the axes we use (see docs/BRAND.md) -->
		<link rel="preload" href="%sveltekit.assets%/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			@font-face {
				font-family: 'Archivo';
				font-style: normal;
				font-weight: 400 900;
				font-stretch: 68% 100%;
				font-display: swap;
				src: url(%sveltekit.assets%/fonts/archivo-latin.woff2) format('woff2');
			}
			@font-face {
				font-family: 'Martian Mono';
				font-style: normal;
				font-weight: 400 700;
				font-stretch: 87.5%;
				font-display: swap;
				src: url(%sveltekit.assets%/fonts/martian-mono-latin.woff2) format('woff2');
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
