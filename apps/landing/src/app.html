<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!-- fonts are self-hosted, subset to latin and to the axes we use (see docs/BRAND.md);
		     only the display face is preloaded, it sets the largest text -->
		<link rel="preload" href="%sveltekit.assets%/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
		<style>
			@font-face {
				font-family: 'Archivo';
				font-style: normal;
				font-weight: 400 900;
				font-stretch: 68% 100%;
				font-display: swap;
				src: url(%sveltekit.assets%/fonts/archivo-latin.woff2) format('woff2');
			}
			@font-face {
				font-family: 'Martian Mono';
				font-style: normal;
				font-weight: 400 700;
				font-stretch: 87.5%;
				font-display: swap;
				src: url(%sveltekit.assets%/fonts/martian-mono-latin.woff2) format('woff2');
			}
		</style>
		<meta name="theme-color" content="#efe8d9" />
		<!-- the theme is set before the first paint: the viewer's choice, else the system's -->
		<script>
			try {
				var t = localStorage.getItem('misomoon.theme')
			} catch (e) {}
			if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
			document.documentElement.dataset.theme = t
			if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#0f0d0a'
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
